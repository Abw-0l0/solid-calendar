name: Release

# Tag-triggered. Everything CI checks runs again here before anything is published,
# because a tag can be pushed from a branch CI never saw.
on:
  push:
    tags: ['v*']
  # Lets a release be re-run later — e.g. after fixing credentials — without moving
  # the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.4.0'
        required: true
      publish:
        description: 'Publish to npm'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:imports
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:smoke
      - run: node scripts/verify-pack.js

      - name: Tag must match the package version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${TAG#v}"
          PKG=$(node -p "require('./packages/core/package.json').version")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag $TAG does not match package $PKG"; exit 1; }
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for npm provenance, which links the published tarball to this run.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      # registry-url is required, and matches npm's documented trusted-publishing setup.
      # It writes an .npmrc with an _authToken line interpolated from NODE_AUTH_TOKEN,
      # which is unset here. That is harmless when OIDC succeeds, because npm exchanges
      # the GitHub ID token for a real one first and never reads the placeholder. If OIDC
      # is NOT attempted, that placeholder is what turns a clear ENEEDAUTH into a
      # confusing 404 — see the preconditions step below when diagnosing.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10, which predates OIDC support. Trusted publishing needs
      # 11.5.1+; without this the publish fails outright, because there is no longer a
      # token to fall back to.
      - name: Use an npm that supports OIDC
        run: npm install -g npm@latest

      # So a failed publish is diagnosable from the log alone. Only key names are printed,
      # never values, so this cannot leak a credential.
      - name: Show publish preconditions
        run: |
          echo "npm      $(npm --version)   (needs >= 11.5.1)"
          echo "registry $(npm config get registry)"
          echo "OIDC request URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:+present}${ACTIONS_ID_TOKEN_REQUEST_URL:-MISSING}"
          for r in "$NPM_CONFIG_USERCONFIG" "$HOME/.npmrc" "./.npmrc"; do
            if [ -f "$r" ]; then echo "npmrc $r keys:"; cut -d= -f1 "$r"; fi
          done

      - run: npm ci
      - run: npm run build

      # Authenticated by OIDC (npm trusted publishing): GitHub mints a short-lived token
      # asserting this repository and workflow filename, and npm matches it against the
      # trusted publisher registered for the package. Nothing is stored in the repo.
      #
      # There is deliberately no NPM_TOKEN fallback. npm prefers OIDC but falls back to a
      # token silently when one is present, so keeping one would hide a broken OIDC setup
      # until bypass-2FA tokens lose publishing rights in January 2027 — turning a fixable
      # failure now into a blocked release then.
      #
      # Renaming this file or the repository breaks publishing: the registration pins both.
      #
      # Not gated on any secret existing. A tag was pushed, so a publish was intended, and
      # failing loudly beats reporting success having shipped nothing.
      - name: Publish steadycalendar
        if: github.event_name == 'push' || inputs.publish
        run: npm publish --provenance --access public -w packages/core --loglevel verbose

      # Only reached when the publish above succeeded, so the wording is safe.
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            `steadycalendar@${{ needs.verify.outputs.version }}` is on npm.

            See [CHANGELOG.md](https://github.com/Abw-0l0/steady-calendar/blob/main/CHANGELOG.md).
